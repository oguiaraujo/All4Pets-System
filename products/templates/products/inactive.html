{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Produtos</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'products/main.js' %}" defer></script>
</head>
<body>
<div class="container">
    <h2>Produtos Inativos</h2>
    <p>Selecione os produtos que deseja reativar e clique no botão abaixo.</p>

    <div class="my-3">
        <button id="reactivateButton" class="btn btn-success">
            <i class="fas fa-check"></i> Reativar Selecionados
        </button>
        <a href="{% url 'products_list' %}" class="btn btn-secondary">Voltar para Ativos</a>
    </div>

    <table id="inactiveProductsTable" class="table table-striped table-bordered">
        <thead>
            <tr>
                <th><input type="checkbox" id="selectAllCheckbox" title="Selecionar Todos"></th>
                <th>Código</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Data de Validade</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="5" class="text-center">Carregando...</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
